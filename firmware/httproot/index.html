
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Light Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="panel">
        <h1>Light Control</h1>

        <nav>
            <a href="animations.html">Animations</a>
        </nav>

        <div class="clock" aria-label="Interactive light display">
            <div class="digit" data-digit="0"></div>
            <div class="digit" data-digit="1"></div>

            <div class="colon" aria-label="Colon lights">
                <button
                    type="button"
                    class="colon-dot light"
                    data-light-id="X0"
                    aria-label="Colon light X0"
                    aria-pressed="false"
                    title="X0"
                ></button>
                <button
                    type="button"
                    class="colon-dot light"
                    data-light-id="X1"
                    aria-label="Colon light X1"
                    aria-pressed="false"
                    title="X1"
                ></button>
            </div>

            <div class="digit" data-digit="2"></div>
            <div class="digit" data-digit="3"></div>
        </div>

        <p class="instructions">
            Click any light to toggle it on or off.
        </p>

        <form id="hex-form" class="hex-form" novalidate>
            <label for="hex-input">Raw output (11 bytes, hex)</label>
            <div class="hex-row">
                <input
                    id="hex-input"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="00 00 00 00 00 00 00 00 00 00 00"
                >
                <button type="submit">Send</button>
            </div>
        </form>

        <form id="animation-form" class="hex-form" novalidate>
            <label for="animation-file">Custom animation (JSON file)</label>
            <div class="hex-row">
                <input
                    id="animation-file"
                    type="file"
                    accept=".json,application/json"
                >
                <button type="submit">Play</button>
            </div>
        </form>

        <div class="legend">
            <span><i class="legend-light red"></i> Red</span>
            <span><i class="legend-light yellow"></i> Yellow</span>
            <span><i class="legend-light green"></i> Green</span>
        </div>

        <p id="api-status" role="status">Ready</p>
    </main>
</body>
</html>
